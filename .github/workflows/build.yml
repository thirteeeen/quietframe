name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      # Set KEYSTORE_B64 and KEYSTORE_PASS secrets to sign with your own key, so each build
      # installs over the last one. Without them every run makes a throwaway key.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > key.jks; fi
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'quietframe' }}
        run: sh build.sh
      - name: Check APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging out/quietframe.apk | head -5
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify out/quietframe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quietframe-apk
          path: out/quietframe.apk
